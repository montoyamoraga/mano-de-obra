<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pirámide</title>
<style>
:root { --bg: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; }
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Las manos caen sin parar sobre una pila. Cada una cae cerca del centro y
// resbala hacia abajo mientras el escalón con la celda vecina sea muy alto,
// como la arena: así la pila crece como pirámide, sin tamaño máximo. La
// cámara no se aleja, y la pila termina llenando la pantalla.
const CELDA = 0.1;             // metros; el puño con su tela mide unos 30 cm
const GROSOR = 0.04;           // cuánto sube una celda con cada mano
const ESCALON = 0.07;          // el escalón más alto que aguanta sin resbalar
const ALTURA_CAIDA = 2;        // desde dónde caen, sobre donde aterrizan
const DURACION_CAIDA = 0.45;   // segundos
const MANOS_POR_SEGUNDO = 10;  // al principio
const ACELERACION = 0.03;      // la cadencia crece un 3 % por segundo
const POR_BLOQUE = 1024;       // manos por InstancedMesh

// Azar con semilla, para que la pila sea siempre la misma.
let semilla = 7102026;
function azar() {
  semilla = (semilla * 1664525 + 1013904223) >>> 0;
  return semilla / 4294967296;
}

// Escena, con las mismas luces que trompo y el visor de piruetas.xyz.
const dibujante = new THREE.WebGLRenderer({ antialias: true, alpha: true });
document.body.append(dibujante.domElement);
dibujante.setPixelRatio(Math.min(devicePixelRatio, 2));
dibujante.outputColorSpace = THREE.SRGBColorSpace;
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
escena.add(camara);
camara.add(new THREE.AmbientLight(0xffffff, 1.2));
const luzPrincipal = new THREE.DirectionalLight(0xffffff, 1.5);
luzPrincipal.position.set(1, 1, 2);
camara.add(luzPrincipal);
const luzRelleno = new THREE.DirectionalLight(0xffffff, 0.6);
luzRelleno.position.set(-1, 0.5, -1);
camara.add(luzRelleno);

function ajustarTamano() {
  dibujante.setSize(innerWidth, innerHeight);
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
}
addEventListener('resize', ajustarTamano);
ajustarTamano();

const gltf = await new GLTFLoader().loadAsync('puno.glb');
let original;
gltf.scene.traverse((objeto) => { if (objeto.isMesh && !original) original = objeto; });
const geometria = original.geometry;
const material = original.material;
// El escaneo es solo la superficie de arriba: sin esto, las manos que
// quedan de lado se ven huecas.
material.side = THREE.DoubleSide;

// Las manos van en bloques; cuando uno se llena, se agrega otro.
const bloques = [];
function bloqueNuevo() {
  const bloque = new THREE.InstancedMesh(geometria, material, POR_BLOQUE);
  bloque.count = 0;
  bloque.frustumCulled = false;
  escena.add(bloque);
  bloques.push(bloque);
  return bloque;
}

// Altura de la pila en cada celda.
const alturas = new Map();
const altura = (i, j) => alturas.get(`${i},${j}`) ?? 0;
const VECINAS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

const cayendo = [];

function soltarMano() {
  // Cae cerca del centro y resbala hacia la vecina más baja.
  let i = Math.round((azar() - 0.5) * 2);
  let j = Math.round((azar() - 0.5) * 2);
  for (;;) {
    let mejor = null, menor = altura(i, j) - ESCALON;
    const inicio = Math.floor(azar() * 4);
    for (let k = 0; k < 4; k++) {
      const [di, dj] = VECINAS[(inicio + k) % 4];
      const h = altura(i + di, j + dj);
      if (h < menor) { menor = h; mejor = [i + di, j + dj]; }
    }
    if (!mejor) break;
    [i, j] = mejor;
  }
  const suelo = altura(i, j);
  alturas.set(`${i},${j}`, suelo + GROSOR);

  let bloque = bloques.at(-1);
  if (!bloque || bloque.count === POR_BLOQUE) bloque = bloqueNuevo();
  const mano = {
    bloque,
    indice: bloque.count++,
    posicion: new THREE.Vector3(
      i * CELDA + (azar() - 0.5) * CELDA * 0.6,
      suelo,
      j * CELDA + (azar() - 0.5) * CELDA * 0.6,
    ),
    giro: new THREE.Euler((azar() - 0.5) * 0.8, azar() * Math.PI * 2, (azar() - 0.5) * 0.8),
    escala: 0.9 + azar() * 0.2,
    vueltas: (azar() - 0.5) * 6,
    avance: 0,
  };
  cayendo.push(mano);
  ponerMano(mano);
}

const matriz = new THREE.Matrix4();
const cuaternion = new THREE.Quaternion();
const giro = new THREE.Euler();
const posicion = new THREE.Vector3();
const escala = new THREE.Vector3();

// Caída libre: la altura baja con el cuadrado del tiempo.
function ponerMano(mano) {
  const p = mano.avance;
  posicion.copy(mano.posicion);
  posicion.y += ALTURA_CAIDA * (1 - p * p);
  giro.set(mano.giro.x, mano.giro.y + mano.vueltas * (1 - p), mano.giro.z);
  cuaternion.setFromEuler(giro);
  escala.setScalar(mano.escala);
  mano.bloque.setMatrixAt(mano.indice, matriz.compose(posicion, cuaternion, escala));
  mano.bloque.instanceMatrix.needsUpdate = true;
}

const reloj = new THREE.Timer();
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
let pendientes = 1;

function cuadro(ahora) {
  reloj.update(ahora);
  const dt = Math.min(reloj.getDelta(), 0.25);
  const t = reloj.getElapsed();

  // Cada vez caen más seguido.
  pendientes += dt * MANOS_POR_SEGUNDO * Math.exp(ACELERACION * t);
  while (pendientes >= 1) { soltarMano(); pendientes--; }

  for (let k = cayendo.length - 1; k >= 0; k--) {
    const mano = cayendo[k];
    mano.avance = quieto ? 1 : Math.min(1, mano.avance + dt / DURACION_CAIDA);
    ponerMano(mano);
    if (mano.avance === 1) cayendo.splice(k, 1);
  }

  // La cámara gira despacio, siempre a la misma distancia.
  const angulo = quieto ? 0.6 : t * 0.08;
  const distancia = 2.2, elevacion = 0.42, mira = 0.2;
  camara.position.set(
    Math.cos(angulo) * Math.cos(elevacion) * distancia,
    mira + Math.sin(elevacion) * distancia,
    Math.sin(angulo) * Math.cos(elevacion) * distancia,
  );
  camara.lookAt(0, mira, 0);

  dibujante.render(escena, camara);
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);
</script>
</body>
</html>
